<lib-sidebar
  [isOpen]="isOpen()"
  (isOpenChange)="isOpen.set($event)"
  position="start"
  [collapsible]="true"
  collapsedWidth="64px"
>
  <lib-sidebar-content>
    <lib-sidebar-section class="sidebar-new-chat-section">
      @if (isOpen()) {
      <lib-button
        class="new-chat-btn"
        [config]="newChatButtonConfig"
        (click)="newConversation.emit()"
      />
      }
    </lib-sidebar-section>
    @if (isOpen()) {

    <lib-sidebar-section class="sidebar-links">
      <lib-list
        [config]="sidebarLinksConfig"
        (itemClicked)="onLinkClicked($event)"
      />
    </lib-sidebar-section>
    }
    <lib-sidebar-section [label]="'Chats'" class="sidebar-recent-section">
      @if (isOpen()) {
      <app-chat-history-list
        [conversations]="conversations()"
        [activeThreadId]="currentThreadId()"
        (conversationSelected)="onConversationSelected($event)"
      />
      } @else {
      <lib-icon name="history" [size]="24" class="sidebar-rail-icon" />
      }
    </lib-sidebar-section>
  </lib-sidebar-content>
  <lib-sidebar-footer>
    @if (!isOpen()) {
    <lib-button [config]="collapseSideBarButtonConfig" />
    }
  </lib-sidebar-footer>
</lib-sidebar>
